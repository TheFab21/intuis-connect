  # ===================================================================
  - title: Énergie
    path: energie
    icon: mdi:lightning-bolt
    cards:
      # ---------------------------------------------------------------
      # BLOC ENERGIE — séries externes horaires
      #
      # Ces séries n'ont PAS d'entité : leur identifiant est un condensé
      # sha256 que rien dans Home Assistant n'épelle. Chaque capteur
      # sensor.<piece>_energy le publie dans son attribut
      # « hourly_statistic_id ».
      #
      # Pour générer les lignes ci-dessous, colle ceci dans
      # Outils de développement -> Modèle, puis recopie la sortie :
      #
      #   {% for s in states.sensor
      #        | selectattr('attributes.hourly_statistic_id', 'defined')
      #        | sort(attribute='name') %}
      #   - entity: {{ s.attributes.hourly_statistic_id }}
      #     name: {{ s.name | replace(' Energy', '') }}
      #   {% endfor %}
      #
      # Les identifiants ci-dessous ont été relevés le 17/11/2026.
      # Ils ne changent que si une pièce est recréée côté cloud.
      # ---------------------------------------------------------------
      - type: statistics-graph
        title: Détail horaire par pièce — 48 h
        period: hour
        stat_types: [change]
        chart_type: bar
        days_to_show: 2
        entities:
          - entity: intuis_connect:energy_245a05f7781a0fe5a0e3985c28f87131
            name: Chambre d'amis
          - entity: intuis_connect:energy_11176ac36e1e9c472405391e83b9a831
            name: Chambre filles
          - entity: intuis_connect:energy_fe511d42945d493beca4c0d28ef8850a
            name: Chambre parents
          - entity: intuis_connect:energy_3d06888dd09d9e2b43d9e94351d6dbca
            name: Couloir
          - entity: intuis_connect:energy_61aef8adbcd08c6e6c1a957f5fdf910e
            name: Cuisine
          - entity: intuis_connect:energy_ae366fc8ecab9cfadcda4a20e06aced5
            name: Entrée
          - entity: intuis_connect:energy_147dc73b6e1769bdf051b79a7306b0fa
            name: Salle à manger
          - entity: intuis_connect:energy_31ca63e5a749f1eb1fb19541a434f507
