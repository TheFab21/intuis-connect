# Tableau de bord chauffage — Lens
# Adapté pour intuis_connect 2.1.1 (upstream 2.1.0 + correctifs énergie).
#
# Les identifiants d'entités sont inchangés : le renommage a été abandonné,
# Home Assistant ne migrant pas les entity_id sur un changement de nom.
#
# Deux choses à faire avant que la vue Énergie fonctionne :
#   1. générer les identifiants de statistiques externes (voir le bloc ENERGIE ci-dessous)
#   2. remplacer les lignes « REMPLACER_… » par ce que le modèle produit

views:
  # ===================================================================
  - title: Pilotage
    path: pilotage
    icon: mdi:home-thermometer
    cards:
      - type: entities
        title: Maison — Lens
        show_header_toggle: false
        entities:
          - entity: select.intuis_home_active_schedule
            name: Planning actif
            icon: mdi:calendar-check
          - entity: sensor.intuis_home_current_zone
            name: Zone en cours
            icon: mdi:map-marker-radius
          - entity: sensor.intuis_home_next_zone_change
            name: Prochain changement
            icon: mdi:clock-fast
          - entity: sensor.intuis_home_therm_mode
            name: Mode thermique
            icon: mdi:thermostat-cog
          - type: divider
          - entity: sensor.intuis_home_energy_today
            name: Énergie aujourd'hui
            icon: mdi:lightning-bolt

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Absent semaine
            icon: mdi:briefcase-clock
            show_state: false
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.intuis_home_active_schedule
              data:
                option: Absent Semaine
          - type: button
            name: À la maison — toutes pièces
            icon: mdi:home-heart
            show_state: false
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.intuis_home_active_schedule
              data:
                option: A La Maison Toutes Pièces
          - type: button
            name: À la maison — haut
            icon: mdi:home-floor-2
            show_state: false
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.intuis_home_active_schedule
              data:
                option: A La Maison Haut
          - type: button
            name: Pas utilisé
            icon: mdi:home-off-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.intuis_home_active_schedule
              data:
                # Attention : l'option du cloud comporte une espace finale.
                option: 'Pas Utilisé '

      # Les tuiles exposent maintenant les présélections. L'intégration en
      # publie quatre : home (programme), away (absent), boost, eco (hors-gel).
      # const.py : PRESET_SCHEDULE = "home", PRESET_FROST_PROTECT = "eco".
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: climate.chambre_damis_chambre_damis_climate
            name: Chambre d'amis
            icon: mdi:bed-king-outline
            features:
              - type: climate-hvac-modes
                hvac_modes: [auto, heat, 'off']
              - type: target-temperature
              - type: climate-preset-modes
                style: icons
                preset_modes: [home, away, boost, eco]
          - type: tile
            entity: climate.chambre_filles_chambre_filles_climate
            name: Chambre filles
            icon: mdi:bed-double-outline
            features:
