  - title: Diagnostic
    path: diagnostic
    icon: mdi:stethoscope
    cards:
      - type: markdown
        content: >
          **Diagnostics de l'intégration** — nouveauté 2.1.0. Paramètres →
          Appareils et services → Intuis Connect → ⋮ → *Télécharger les
          diagnostics*. L'export contient tous les plannings chargés, zones
          inutilisées comprises, sans identifiants cloud ni jetons.


          **Fil pilote** — les pièces sans sonde de température sont
          désormais détectées et pilotées par ordre (confort / éco /
          hors-gel) plutôt que par consigne. Aucune des onze pièces de
          Lens n'est dans ce cas : toutes remontent une température.


          **Mesure d'énergie** — les pièces dont le cloud répond « pas de
          thermostat relais » (erreur 21) sont maintenant ignorées
          proprement au lieu de faire échouer le cycle horaire.

      - type: entities
