# Kiosque chauffage Lens — piloté par Node-RED
# Créer le tableau de bord avec l'URL : kiosque-chauffage
# Requis (HACS) : button-card ; optionnel : kiosk-mode (NemesisRE). Sortie du kiosque : ?disable_km
# Toucher une pièce la sélectionne dans « Pilotage d'une pièce » ; appui long : historique.

title: Chauffage Lens
kiosk_mode:
  non_admin_settings:
    kiosk: true
  admin_settings:
    hide_sidebar: true
button_card_templates:
  piece_lens:
    variables:
      consigne: ''
      option: ''
    layout: vertical
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    state_display: '[[[ var t = parseFloat(entity.state); return isNaN(t) ? ''—'' : t.toFixed(1) + '' °C''; ]]]'
    label: '[[[ var c = states[variables.consigne]; var v = c ? parseFloat(c.state) : NaN; return isNaN(v) ? ''Consigne
      —'' : ''Consigne '' + v.toFixed(1) + '' °C''; ]]]'
    tap_action:
      action: perform-action
      perform_action: input_select.select_option
      target:
        entity_id: input_select.tmp_choix_piece
      data:
        option: '[[[ return variables.option; ]]]'
    hold_action:
      action: more-info
    styles:
      card:
      - height: 118px
      - padding: 8px
      - border-radius: 16px
      - border: '[[[ var s = states[''input_select.tmp_choix_piece'']; return (s && s.state === variables.option)
          ? ''3px solid var(--primary-color)'' : ''1px solid var(--divider-color)''; ]]]'
      icon:
      - width: 26px
      name:
      - font-size: 13px
      - font-weight: '600'
      - white-space: normal
      state:
      - font-size: 22px
      - font-weight: '700'
      - color: '[[[ var t = parseFloat(entity.state); var c = states[variables.consigne]; var v = c ? parseFloat(c.state)
          : NaN; if (isNaN(t) || isNaN(v)) return ''var(--primary-text-color)''; if (t < v - 0.5) return ''var(--warning-color,
          #f39c12)''; if (t > v + 1) return ''var(--info-color, #3498db)''; return ''var(--success-color, #2ecc71)'';
          ]]]'
      label:
      - font-size: 12px
      - opacity: '0.75'
views:
- title: Chauffage
  path: chauffage
  icon: mdi:radiator
  type: sections
  max_columns: 4
  badges: &id001
  - type: entity
    entity: weather.forecast_home
    show_name: false
  - type: entity
    entity: sensor.mode_maison
    show_name: false
  - type: entity
    entity: sensor.consomation_totale_chauffage_2
    name: Chauffage
    show_name: true
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: button
      name: ● Chauffage
      icon: mdi:radiator
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/chauffage
      grid_options:
        columns: 4
        rows: 1
    - type: button
      name: Températures
      icon: mdi:thermometer-lines
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/temperatures
      grid_options:
        columns: 4
        rows: 1
    - type: button
      name: Énergie
      icon: mdi:lightning-bolt
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/energie
      grid_options:
        columns: 4
        rows: 1
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Maison
      icon: mdi:home-thermometer
    - type: tile
      entity: sensor.mode_maison
      name: Mode en cours
      icon: mdi:home-switch
      grid_options:
        columns: 6
    - type: tile
      entity: input_datetime.away_until_date
      name: Absent jusqu'au
      icon: mdi:calendar-clock
      grid_options:
        columns: 6
    - type: tile
      entity: input_select.radiateurs_intuis_set_mode
      name: Mode demandé
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 12
    - type: tile
      entity: input_select.liste_des_plannings_nr
      name: Planning
      icon: mdi:calendar-check
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Pilotage d'une pièce
      icon: mdi:gesture-tap
    - type: tile
      entity: input_select.tmp_choix_piece
      name: Pièce
      icon: mdi:floor-plan
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 12
    - type: tile
      entity: input_select.tmp_mode_chauffage
      name: Mode
      icon: mdi:thermostat-cog
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 6
    - type: tile
      entity: input_datetime.tmp_echeance_fin
      name: Jusqu'à
      icon: mdi:calendar-end
      grid_options:
        columns: 6
    - type: tile
      entity: input_number.tmp_consigne_temperature
      name: Consigne
      icon: mdi:thermometer
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
      grid_options:
        columns: 8
    - type: button
      name: Appliquer
      icon: mdi:check-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.pilotage_chauffage
      grid_options:
        columns: 4
        rows: 1
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      content: "{%- set nr = integration_entities('nodered') -%}\n{%- set ouvertes = states.binary_sensor\n    \
        \ | selectattr('entity_id', 'in', nr)\n     | selectattr('attributes.device_class', 'defined')\n     | selectattr('attributes.device_class',\
        \ 'eq', 'window')\n     | selectattr('state', 'eq', 'on')\n     | map(attribute='name') | list -%}\n{%-\
        \ if ouvertes -%}\n### \U0001FA9F {{ ouvertes | count }} fenêtre{{ 's' if ouvertes | count > 1 }} ouverte{{\
        \ 's' if ouvertes | count > 1 }}\n{{ ouvertes | map('replace', 'Fenêtre ouverte ', '') | map('replace',\
        \ 'Fenetre ouverte ', '') | join(' · ') }}\n{%- else -%}\n✅ Toutes les fenêtres sont fermées\n{%- endif\
        \ -%}\n"
      grid_options:
        columns: 9
    - type: button
      name: Acquitter
      icon: mdi:check-all
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.ack_windows_open
      grid_options:
        columns: 3
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Séjour
      icon: mdi:sofa
    - type: custom:button-card
      template: piece_lens
      entity: sensor.temperature_salon_2
      name: Salon
      icon: mdi:sofa-outline
      variables:
        consigne: sensor.temp_consigne_salon_2
        option: Salon
      triggers_update:
      - input_select.tmp_choix_piece
      - sensor.temp_consigne_salon_2
      grid_options:
        columns: 6
    - type: custom:button-card
      template: piece_lens
      entity: sensor.temperature_salle_a_manger_cuisine
