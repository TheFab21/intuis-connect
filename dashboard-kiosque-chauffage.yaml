      triggers_update:
      - input_select.tmp_choix_piece
      - sensor.temperature_consigne_chambre_parents_2
      grid_options:
        columns: 6
    - type: custom:button-card
      template: piece_lens
      entity: sensor.temperature_chambre_filles_2
