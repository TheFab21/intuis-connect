- title: Eau chaude
  path: eau-chaude
  icon: mdi:water-boiler
  type: sections
  max_columns: 4
  badges: *id001
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        name: Chauffage
        icon: mdi:radiator
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/chauffage
      - type: button
        name: ● Eau chaude
        icon: mdi:water-boiler
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/eau-chaude
      - type: button
        name: Médias
        icon: mdi:music
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/medias
      - type: button
        name: Températures
        icon: mdi:thermometer-lines
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/temperatures
      - type: button
        name: Énergie
        icon: mdi:lightning-bolt
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/energie
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Chauffe-eau
      icon: mdi:water-boiler
    - type: thermostat
      entity: climate.temperature_eau_chaude
      name: Eau chaude
      features:
      - type: climate-hvac-modes
        style: icons
        hvac_modes:
        - heat
        - 'off'
      - type: climate-preset-modes
        style: dropdown
      grid_options:
        columns: 12
    - type: markdown
      content: '## Chauffe-eau — Cave


        {% set p = states(''sensor.compteur_switch_chauffe_eau_total_active_power'') | float(0) %}

        {% set relay = states(''switch.compteur_switch_chauffe_eau'') %}

        {% set act = state_attr(''climate.temperature_eau_chaude'',''hvac_action'') %}

        {% set tw = state_attr(''climate.temperature_eau_chaude'',''current_temperature'') | float(0) %}

        {% set sp = state_attr(''climate.temperature_eau_chaude'',''temperature'') | float(0) %}


        **État :**

        {% if relay in [''unavailable'',''unknown''] %} ⚠️ **Relais injoignable**

        {% elif states(''sensor.shellyplusuni_boiler_temperature_2'') in [''unavailable'',''unknown''] %} ⚠️ **Sonde
        eau injoignable**

        {% elif act == ''heating'' and p < 50 %} ⚠️ **Demande de chauffe mais 0 W** (coupure / résistance ?)

        {% elif p > 200 and tw < 50 %} 🔥 En chauffe — {{ p | round(0) }} W (eau {{ tw }} °C)

        {% elif p > 200 %} 🔥 En chauffe — {{ p | round(0) }} W

        {% else %} 💤 Au repos — eau {{ tw }} °C / consigne {{ sp }} °C

        {% endif %}


        ---


        {% if is_state(''input_boolean.chauffe_eau_auto_armed'',''on'') %}

        🧪 **Cycle anti-légionelle EN COURS** — fin prévue {{ as_timestamp(states(''input_datetime.chauffe_eau_off_at''))
        | timestamp_custom(''%d/%m à %H:%M'', true) }}

        {% else %}

        {% set last = states(''input_datetime.chauffe_eau_eau_chaude_le'') %}

        {% if last in [''unknown'',''unavailable'',''none'',''''] %}

        🟢 Pas de cycle — *horodatage eau chaude pas encore initialisé*

        {% else %}

        {% set days = (as_timestamp(now()) - as_timestamp(last)) / 86400 %}

        🟢 Pas de cycle — dernière eau ≥ 40 °C il y a **{{ days | round(1) }} j**, prochain cycle dans **{{ (30 -
        days) | round(1) }} j**

        {% endif %}

        {% endif %}

        '
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Mesures
      icon: mdi:gauge
    - type: gauge
      entity: sensor.shellyplusuni_boiler_temperature_2
      name: Eau
      unit: °C
      min: 10
      max: 65
      needle: true
      severity:
        red: 0
        yellow: 40
        green: 50
      grid_options:
        columns: 6
    - type: gauge
      entity: sensor.compteur_switch_chauffe_eau_total_active_power
      name: Puissance
      unit: W
      min: 0
      max: 5000
      needle: true
      severity:
        red: 0
        yellow: 200
        green: 3000
      grid_options:
        columns: 6
    - type: tile
      entity: input_boolean.chauffe_eau_auto_armed
      name: Cycle anti-légionelle
      icon: mdi:bacteria-outline
      grid_options:
        columns: 6
      tap_action: &id002
        action: more-info
      icon_tap_action: &id003
        action: none
    - type: tile
      entity: input_datetime.chauffe_eau_off_at
      name: Fin de cycle prévue
      grid_options:
        columns: 6
      tap_action: *id002
      icon_tap_action: *id003
    - type: tile
      entity: input_datetime.chauffe_eau_eau_chaude_le
      name: Dernière eau ≥ 40 °C
      grid_options:
        columns: 6
      tap_action: *id002
      icon_tap_action: *id003
    - type: tile
      entity: switch.compteur_switch_chauffe_eau
      name: Relais (lecture seule)
      icon: mdi:flash
      grid_options:
        columns: 6
      tap_action: *id002
      icon_tap_action: *id003
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Température et puissance — 48 h
      icon: mdi:chart-line
    - type: history-graph
      hours_to_show: 48
      grid_options:
        columns: full
      entities:
      - entity: sensor.shellyplusuni_boiler_temperature_2
        name: Eau chaude
      - entity: sensor.compteur_switch_chauffe_eau_total_active_power
        name: Puissance
