# Kiosque chauffage — tablette murale
# Créer le tableau de bord avec l'URL : kiosque-chauffage
# Mode kiosque : plugin HACS « kiosk-mode » (NemesisRE). Sans lui, la clé kiosk_mode est ignorée.
# Sortir du mode kiosque : ajouter ?disable_km à l'URL.

title: Chauffage
kiosk_mode:
  non_admin_settings:
    kiosk: true
  admin_settings:
    hide_sidebar: true
views:
- title: Chauffage
  path: chauffage
  icon: mdi:radiator
  type: sections
  max_columns: 4
  badges: &id002
  - type: entity
    entity: weather.forecast_home
    show_name: false
  - type: entity
    entity: sensor.mode_maison
    show_name: false
  - type: entity
    entity: sensor.intuis_home_energy_today
    name: Aujourd'hui
    show_name: true
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: button
      name: ● Chauffage
      icon: mdi:radiator
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/chauffage
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: Pièces
      icon: mdi:floor-plan
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/pieces
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: Températures
      icon: mdi:thermometer-lines
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/temperatures
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: Énergie
      icon: mdi:lightning-bolt
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /kiosque-chauffage/energie
      grid_options:
        columns: 3
        rows: 1
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Maison
      icon: mdi:home-thermometer
    - type: tile
      entity: sensor.mode_maison
      name: Mode en cours
      icon: mdi:home-switch
      grid_options:
        columns: 4
    - type: tile
      entity: input_select.radiateurs_intuis_set_mode
      name: Mode demandé
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 4
    - type: tile
      entity: input_datetime.away_until_date
      name: Absent jusqu'au
      icon: mdi:calendar-clock
      grid_options:
        columns: 4
    - type: tile
      entity: input_select.liste_des_plannings_nr
      name: Planning
      icon: mdi:calendar-check
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.intuis_home_current_zone
      name: Zone en cours
      icon: mdi:map-marker-radius
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.intuis_home_next_zone_change
      name: Prochain changement
      icon: mdi:clock-fast
      grid_options:
        columns: 4
  - type: grid
    column_span: 4
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: binary_sensor.salon_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.salle_a_manger_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.cuisine_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.chambre_parents_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.chambre_filles_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.chambre_damis_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.salle_de_bain_parents_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.salle_de_bain_filles_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.toilettes_visiteurs_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.entree_open_window
        state: 'on'
      - condition: state
        entity: binary_sensor.couloir_open_window
        state: 'on'
    cards:
    - type: heading
      heading: Fenêtres ouvertes
      icon: mdi:window-open-variant
    - type: tile
      entity: binary_sensor.salon_open_window
      name: Salon
      icon: mdi:window-open-variant
      color: red
      grid_options:
        columns: 3
      visibility:
      - condition: state
        entity: binary_sensor.salon_open_window
        state: 'on'
    - type: tile
      entity: binary_sensor.salle_a_manger_open_window
      name: Salle à manger
      icon: mdi:window-open-variant
      color: red
      grid_options:
        columns: 3
      visibility:
