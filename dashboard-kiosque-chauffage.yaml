      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Salles d'eau
      icon: mdi:shower
    - type: custom:button-card
      template: piece_lens
      entity: sensor.temperature_salle_de_bain_parents_2
      name: SdB parents
      icon: mdi:shower-head
      variables:
        consigne: sensor.temperature_consigne_salle_de_bain_parents_2
        option: Salle De Bain Parents
      triggers_update:
      - input_select.tmp_choix_piece
