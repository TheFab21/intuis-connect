# Kiosque chauffage Lens — piloté par Node-RED
# Créer le tableau de bord avec l'URL : kiosque-chauffage
# Requis (HACS) : button-card ; optionnel : kiosk-mode (NemesisRE). Sortie du kiosque : ?disable_km
# Toucher une pièce la sélectionne dans « Pilotage d'une pièce » ; appui long : historique.

title: Chauffage Lens
kiosk_mode:
  non_admin_settings:
    kiosk: true
  admin_settings:
    hide_sidebar: true
button_card_templates:
  piece_lens:
    variables:
      consigne: ''
      option: ''
      mode: ''
      fenetre: ''
      presence: ''
    layout: vertical
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    state_display: '[[[ var t = parseFloat(entity.state); return isNaN(t) ? ''—'' : t.toFixed(1) + '' °C''; ]]]'
    label: '[[[ var M = {home:''Programme'', schedule:''Programme'', program:''Programme'', auto:''Programme'',
      hg:''Hors-gel'', frost_guard:''Hors-gel'', manual:''Manuel'', away:''Absent'', boost:''Boost'', max:''Boost'',
      off:''Arrêt''}; var c = states[variables.consigne]; var v = c ? parseFloat(c.state) : NaN; var m = states[variables.mode];
      var ms = m ? (M[m.state] || m.state) : ''''; var t = isNaN(v) ? ''→ —'' : ''→ '' + v.toFixed(1) + '' °C'';
      return (ms && ms !== ''unknown'' && ms !== ''unavailable'') ? t + '' · '' + ms : t; ]]]'
    tap_action:
      action: perform-action
      perform_action: input_select.select_option
      target:
        entity_id: input_select.tmp_choix_piece
      data:
        option: '[[[ return variables.option; ]]]'
    hold_action:
      action: more-info
    custom_fields:
      badges: '[[[ var f = states[variables.fenetre], p = states[variables.presence], out = ''''; if (f && f.state
        === ''on'') out += ''🪟''; if (p && p.state === ''on'') out += (out ? '' '' : '''') + ''👤''; return out;
        ]]]'
    styles:
      card:
      - height: 118px
      - padding: 8px
      - border-radius: 16px
      - border: '[[[ var s = states[''input_select.tmp_choix_piece'']; return (s && s.state === variables.option)
          ? ''3px solid var(--primary-color)'' : ''1px solid var(--divider-color)''; ]]]'
      - background-color: '[[[ var f = states[variables.fenetre]; return (f && f.state === ''on'') ? ''rgba(231,
          76, 60, 0.18)'' : ''var(--card-background-color)''; ]]]'
      - position: relative
      icon:
      - width: 26px
      name:
      - font-size: 13px
      - font-weight: '600'
      - white-space: normal
      state:
      - font-size: 22px
      - font-weight: '700'
      - color: '[[[ var t = parseFloat(entity.state); var c = states[variables.consigne]; var v = c ? parseFloat(c.state)
          : NaN; if (isNaN(t) || isNaN(v)) return ''var(--primary-text-color)''; if (t < v - 0.5) return ''var(--warning-color,
          #f39c12)''; if (t > v + 1) return ''var(--info-color, #3498db)''; return ''var(--success-color, #2ecc71)'';
          ]]]'
      label:
      - font-size: 12px
      - opacity: '0.8'
      - white-space: normal
      custom_fields:
        badges:
        - position: absolute
        - top: 6px
        - right: 8px
        - font-size: 15px
