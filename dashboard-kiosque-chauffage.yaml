        icon: mdi:radiator
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/chauffage
      - type: button
        name: Eau chaude
        icon: mdi:water-boiler
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /kiosque-chauffage/eau-chaude
      - type: button
        name: Médias
        icon: mdi:music
        show_state: false
        tap_action:
