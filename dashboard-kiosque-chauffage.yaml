# Kiosque chauffage Lens
# 100 % Node-RED : mode maison et planning (helpers), radiateurs (climates MQTT climate.thermostat_*).
# Créer le tableau de bord avec l'URL : kiosque-chauffage
# Requis (HACS) : button-card ; optionnel : kiosk-mode. Sortie du kiosque : ?disable_km

title: Chauffage Lens
kiosk_mode:
  non_admin_settings:
    kiosk: true
  admin_settings:
    hide_sidebar: true
button_card_templates:
  choix_lens:
    variables:
      option: ''
    show_state: false
    show_name: true
    show_icon: true
    layout: vertical
    styles:
      card:
      - height: 104px
      - padding: 8px
      - border-radius: 16px
      - background-color: '[[[ return entity.state === variables.option ? ''var(--primary-color)'' : ''var(--card-background-color)'';
          ]]]'
      icon:
      - width: 40px
      - color: '[[[ return entity.state === variables.option ? ''var(--text-primary-color)'' : ''var(--primary-color)'';
          ]]]'
      name:
      - font-size: 14px
      - white-space: normal
      - color: '[[[ return entity.state === variables.option ? ''var(--text-primary-color)'' : ''var(--primary-text-color)'';
          ]]]'
  bascule_lens:
    show_state: true
    show_name: true
    show_icon: true
    layout: icon_name_state2nd
    state_display: '[[[ return entity.state === ''on'' ? ''En marche'' : (entity.state === ''off'' ? ''Arrêtée''
      : entity.state); ]]]'
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
      - height: 72px
      - padding: 8px 14px
      - border-radius: 16px
      - background-color: '[[[ return entity.state === ''on'' ? ''rgba(243, 156, 18, 0.22)'' : ''var(--card-background-color)'';
          ]]]'
      icon:
      - width: 34px
      - color: '[[[ return entity.state === ''on'' ? ''var(--warning-color, #f39c12)'' : ''var(--disabled-text-color)'';
          ]]]'
      name:
      - font-size: 15px
      - font-weight: '600'
      - justify-self: start
      state:
      - font-size: 13px
      - opacity: '0.8'
      - justify-self: start
views:
- title: Chauffage
  path: chauffage
  icon: mdi:radiator
  type: sections
  max_columns: 4
  badges: &id001
  - type: entity
    entity: weather.forecast_home
    show_name: false
  - type: entity
    entity: sensor.mode_maison
    show_name: false
  - type: entity
    entity: sensor.consomation_totale_chauffage_2
    name: Chauffage
    show_name: true
  sections:
