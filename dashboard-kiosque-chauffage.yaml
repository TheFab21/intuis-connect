      grid_options:
        columns: 6
    - type: custom:button-card
      template: piece_lens
      entity: sensor.temp_salle_de_bain_filles_2
      name: SdB filles
      icon: mdi:shower
      variables:
        consigne: sensor.temperature_consigne_salle_de_bain_filles_2
        option: Salle De Bain Filles
