# À coller dans mqtt.yaml, sous la clé « climate: » (créez-la si elle n'existe pas).
# Redémarrer Home Assistant ensuite. Entités : climate.thermostat_<pièce>.
climate:
  - name: "Thermostat Salon"
    unique_id: lens_nr_thermostat_salon
    modes: ["auto", "heat", "off"]
    mode_state_topic: lens/chauffage/salon/mode
    mode_command_topic: lens/chauffage/salon/mode/set
    current_temperature_topic: lens/chauffage/salon/temperature
    temperature_state_topic: lens/chauffage/salon/consigne
    temperature_command_topic: lens/chauffage/salon/consigne/set
    preset_modes: ["Hors-gel"]
    preset_mode_state_topic: lens/chauffage/salon/preset
    preset_mode_command_topic: lens/chauffage/salon/preset/set
    min_temp: 7
    max_temp: 28
    temp_step: 0.5
    precision: 0.1
    temperature_unit: C
    qos: 1
