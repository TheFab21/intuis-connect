# A ajouter a la fin de scripts.yaml (les scripts y sont en colonne 0, comme ici).
# Puis Outils de developpement -> YAML -> Recharger les scripts.

regarder_apple_tv:
  alias: "\u25B6 Regarder l'Apple TV"
  icon: mdi:apple
  mode: single
  # Chaine : Apple TV -> Marantz (entree CBL/SAT) -> TV Samsung (entree HDMI2).
  # La TV eteinte ne s'allume pas par le reseau (UE40H7000) : c'est le HDMI-CEC
  # qui la reveille quand l'Apple TV et l'ampli demarrent. Aucune etape TV ne
  # doit donc bloquer la suite.
  sequence:
    - action: media_player.turn_on
      continue_on_error: true
      target:
        entity_id: media_player.marantz
    # remote.turn_on ne fait que (re)connecter Home Assistant a l'Apple TV ;
    # c'est media_player.turn_on qui la sort de veille.
    - action: remote.turn_on
      continue_on_error: true
      target:
        entity_id: remote.apple_tv_salon
    - wait_template: "{{ states('media_player.apple_tv_salon') not in ['unavailable', 'unknown'] }}"
      timeout: "00:00:10"
      continue_on_timeout: true
    - action: media_player.turn_on
      continue_on_error: true
      target:
        entity_id: media_player.apple_tv_salon
    - if: "{{ (state_attr('media_player.tv_samsung_led40', 'supported_features') | int(0)) | bitwise_and(128) > 0 }}"
      then:
        - action: media_player.turn_on
          continue_on_error: true
          target:
            entity_id: media_player.tv_samsung_led40
    # Laisser a l'ampli le temps de demarrer avant de changer d'entree.
    - wait_template: "{{ not is_state('media_player.marantz', 'off') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - action: media_player.select_source
      continue_on_error: true
      target:
        entity_id: media_player.marantz
      data:
        source: CBL/SAT
    # La TV ne publie que "TV" et "HDMI" : on envoie la touche directe HDMI2,
    # seulement si elle est allumee (par le CEC ou deja en marche).
    - wait_template: "{{ not is_state('media_player.tv_samsung_led40', 'off') }}"
      timeout: "00:00:30"
      continue_on_timeout: true
    - if: "{{ not is_state('media_player.tv_samsung_led40', 'off') }}"
      then:
        - action: media_player.play_media
          continue_on_error: true
          target:
            entity_id: media_player.tv_samsung_led40
          data:
            media_content_type: send_key
            media_content_id: KEY_HDMI2

eteindre_salon:
  alias: "\u23FB \u00C9teindre le salon"
  icon: mdi:power
  mode: single
  sequence:
    # media_player.turn_off met l'Apple TV en veille (remote.turn_off ne ferait que
    # deconnecter Home Assistant).
    - action: media_player.turn_off
      continue_on_error: true
      target:
        entity_id: media_player.apple_tv_salon
    - action: media_player.turn_off
      continue_on_error: true
      target:
        entity_id:
          - media_player.tv_samsung_led40
          - media_player.marantz

# -- Apps sur l'Apple TV -------------------------------------------------------
# " app " est un motif (expression reguliere, majuscules ignorees) cherche dans
# la liste des apps que l'Apple TV publie : " ^blue ?tv " trouve " blue TV ".
lancer_app_apple_tv:
  alias: "\U0001F4FA Lancer une app sur l'Apple TV"
  icon: mdi:apple
  mode: restart
  fields:
    app:
      name: Application
      description: "Motif du nom de l'app, majuscules ignor\u00E9es"
      example: netflix
      required: true
      selector:
        text:
  sequence:
    # Allume ampli + TV, met CBL/SAT et HDMI2, reveille l'Apple TV (appel direct : on attend la fin).
    - action: script.regarder_apple_tv
      continue_on_error: true
    - wait_template: >
        {{ not is_state('media_player.apple_tv_salon', 'off')
           and (state_attr('media_player.apple_tv_salon', 'source_list') or []) | count > 0 }}
      timeout: "00:00:30"
      continue_on_timeout: true
    - variables:
        source: >
          {{ (state_attr('media_player.apple_tv_salon', 'source_list') or [])
             | select('search', app, ignorecase=True) | first | default('') }}
    - if: "{{ source == '' }}"
      then:
        - action: persistent_notification.create
          data:
            title: Apple TV
            message: "Aucune app ne correspond \u00E0 \u00AB {{ app }} \u00BB. Apps publi\u00E9es : {{ (state_attr('media_player.apple_tv_salon', 'source_list') or []) | join(', ') }}"
        - stop: App introuvable
    - action: media_player.select_source
      target:
        entity_id: media_player.apple_tv_salon
      data:
        source: "{{ source }}"

# -- Radios : Eversolo, Marantz ou les deux ----------------------------------
# La destination vient de input_select.radio_destination.
# Eversolo : media_player.play_media classique (lecteur DLNA media_player.dmp_a6).
# Marantz : media_player.play_media sur son lecteur DLNA (media_player.marantz_2),
# avec url_marantz = version MP3 de la station. Le lecteur DLNA du NR1603 ne lit
# pas l'AAC en flux continu (UPnP 714, puis "erreur de format de fichier"),
# contrairement a sa source Internet Radio.
lancer_radio:
  alias: "\U0001F4FB Lancer une radio"
  icon: mdi:radio
  mode: restart
  fields:
    url:
      name: Adresse du flux
      required: true
      selector:
        text:
    url_marantz:
      name: Adresse du flux pour le Marantz
      description: "Facultatif. Par d\u00E9faut, url."
      selector:
        text:
    titre:
      name: "Titre affich\u00E9"
      selector:
        text:
    logo:
      name: Logo de la station
      description: "Adresse d'image (affich\u00E9e par l'Eversolo et le Marantz). Facultatif."
      selector:
        text:
  variables:
    cible: "{{ states('input_select.radio_destination') }}"
    # true = l'Eversolo recoit lui aussi la commande UPnP directe (type "radio" +
    # logo), ce qui aide certains lecteurs a afficher le morceau en cours. Exige
    # eversolo_dlna_avtransport dans secrets.yaml. false = media_player.play_media.
    eversolo_par_upnp: true
    # Lecteur natif de l'Eversolo (logo + morceau en cours) : si la station
    # existe dans sa radio internet (Radio perso / favoris) et figure dans la
    # liste des sources de media_player.eversolo_dmp_a6 (fork TheFab21, PR #15),
    # on la choisit par son nom (majuscules et espaces ignores). Sinon : DLNA.
    source_eversolo: >-
      {%- set ns = namespace(s='') -%}
      {%- set cherche = (titre | default('', true)) | lower | trim -%}
      {%- for src in state_attr('media_player.eversolo_dmp_a6', 'source_list') or [] -%}
        {%- if not ns.s and cherche and (src | lower | trim) == cherche -%}{%- set ns.s = src -%}{%- endif -%}
      {%- endfor -%}{{ ns.s }}
    image: "{{ logo if logo is defined and logo else '' }}"
  sequence:
    - if: "{{ cible in ['Marantz', 'Les deux'] }}"
      then:
        # L'ampli peut etre "unknown" (integration en defaut) : on continue.
        - action: media_player.turn_on
          continue_on_error: true
          target:
            entity_id: media_player.marantz
        - wait_template: "{{ not is_state('media_player.marantz', 'off') }}"
          timeout: "00:00:20"
          continue_on_timeout: true
        # Le lecteur reseau de l'ampli doit repondre avant qu'on lui parle. En veille
        # profonde (reglage "Controle reseau" sur Arret), le NR1603 coupe son
        # reseau : ni Home Assistant ni la commande UPnP ne peuvent l'atteindre.
        - wait_template: "{{ states('media_player.marantz_2') not in ['unavailable', 'unknown'] }}"
          timeout: "00:00:30"
          continue_on_timeout: true
        - if: "{{ states('media_player.marantz_2') in ['unavailable', 'unknown'] }}"
          then:
            - action: persistent_notification.create
              data:
                title: Radio sur le Marantz
                message: "Le Marantz ne r\u00E9pond pas sur le r\u00E9seau (lecteur DLNA indisponible) : la station {{ titre | default(url, true) }} n'a pas pu \u00EAtre lanc\u00E9e. Sur l'ampli : R\u00E9glages > R\u00E9seau > Contr\u00F4le r\u00E9seau = Marche, pour qu'il reste joignable en veille."
          else:
            # Chemin qui fonctionne (verifie) : play_media de Home Assistant sur le
            # lecteur DLNA de l'ampli, avec un flux MP3 (son lecteur DLNA ne decode
            # pas l'AAC en flux continu).
            - action: media_player.play_media
              target:
                entity_id: media_player.marantz_2
              data:
                media_content_type: music
                media_content_id: "{{ url_marantz | default(url, true) }}"
                # L'ampli remplace le titre par l'artiste et la chanson diffuses
                # par la radio : le nom de la station passe aussi en "album".
                extra:
                  title: "{{ titre | default(url, true) }}"
                  metadata:
                    albumName: "{{ titre | default(url, true) }}"
    - if: "{{ cible != 'Marantz' and source_eversolo != '' }}"
      then:
        - action: media_player.select_source
          continue_on_error: true
          target:
            entity_id: media_player.eversolo_dmp_a6
          data:
            source: "{{ source_eversolo }}"
    - if: "{{ cible != 'Marantz' and source_eversolo == '' }}"
      then:
        # Reveiller l'Eversolo s'il dort (le lecteur DLNA disparait en veille).
        - if: "{{ states('media_player.dmp_a6') in ['unavailable', 'unknown'] }}"
          then:
            - action: media_player.turn_on
              continue_on_error: true
              target:
                entity_id: media_player.eversolo_dmp_a6
            - wait_template: "{{ states('media_player.dmp_a6') not in ['unavailable', 'unknown'] }}"
              timeout: "00:00:40"
              continue_on_timeout: true
        - if: "{{ states('media_player.dmp_a6') in ['unavailable', 'unknown'] }}"
          then:
            - action: persistent_notification.create
              data:
                title: Radio sur l'Eversolo
                message: "L'Eversolo ne r\u00E9pond pas sur le r\u00E9seau : la station {{ titre | default(url, true) }} n'a pas pu \u00EAtre lanc\u00E9e."
          else:
            # 1) Commande UPnP directe ("station" + logo), si activee.
            - if: "{{ eversolo_par_upnp }}"
              then:
                - action: rest_command.eversolo_dlna_uri
                  continue_on_error: true
                  response_variable: reponse_eversolo
                  data:
                    url: "{{ url }}"
                    titre: "{{ titre | default(url, true) }}"
                    logo: "{{ image }}"
                    mime: "*"
                - if: "{{ reponse_eversolo is defined and reponse_eversolo.status | int(0) == 200 }}"
                  then:
                    - action: rest_command.eversolo_dlna_play
                      continue_on_error: true
            # 2) Sinon, ou si la commande directe a echoue (port change apres un
            #    redemarrage de l'Eversolo...), play_media : Home Assistant connait
            #    toujours la bonne adresse.
            - if: "{{ not eversolo_par_upnp or reponse_eversolo is not defined or reponse_eversolo.status | int(0) != 200 }}"
              then:
                - action: media_player.play_media
                  continue_on_error: true
                  target:
                    entity_id: media_player.dmp_a6
                  data:
                    media_content_type: music
                    media_content_id: "{{ url }}"
                    extra: >-
                      {{ {'title': titre | default(url, true),
                          'metadata': {'albumName': titre | default(url, true)}}
                         | combine({'thumb': image} if image else {}) }}

arreter_radio:
  alias: "\u23F9 Arr\u00EAter la radio"
  icon: mdi:stop
  mode: single
  sequence:
    # Arrete l'Eversolo et le lecteur reseau du Marantz s'ils jouent. Ne touche
    # ni a l'ampli lui-meme ni a l'Apple TV.
    - repeat:
        for_each: >
          {% set ns = namespace(l=['media_player.dmp_a6']) %}
          {% for s in states.media_player
               if s.entity_id != 'media_player.marantz'
               and ('marantz' in s.entity_id or 'marantz' in (s.name | lower))
               and (s.attributes.supported_features | int(0)) | bitwise_and(512) %}
            {% set ns.l = ns.l + [s.entity_id] %}
          {% endfor %}{{ ns.l }}
        sequence:
          - if: "{{ states(repeat.item) in ['playing', 'paused', 'buffering'] }}"
            then:
              - action: media_player.media_stop
                continue_on_error: true
                target:
                  entity_id: "{{ repeat.item }}"
